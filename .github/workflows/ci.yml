name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install (fails on peer dependency conflicts, same as Vercel)
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
